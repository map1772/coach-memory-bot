# Бесплатный сервис Render засыпает после 15 минут без входящих запросов, и тогда
# первое сообщение заказчика ждёт около минуты на разогреве. Пинг раз в пять минут
# держит его живым: запас нужен потому, что расписание GitHub Actions регулярно
# опаздывает на несколько минут, и на интервале в десять минут окно иногда рвётся.
#
# Когда демо отыграет, выключить: Actions -> keepalive -> Disable workflow.
name: keepalive

# Заданию нужен только исходящий curl, токен репозитория ему не нужен вовсе.
# Права прописаны явно, чтобы будущий шаг не унаследовал дефолтные молча.
permissions:
  contents: read

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

# новый запуск заменяет предыдущий, иначе после ручного старта в очереди копятся
# многочасовые задания и лимит Actions выгорает впустую
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # 05.08.2026: расписание Actions на практике срабатывает раз в 2-2.5 часа вместо
      # пяти минут, и сервис успевает уснуть. Поэтому пингуем изнутри одного запуска:
      # 68 итераций по 5 минут покрывают почти шесть часов подряд.
      # -f роняет curl на 5xx, но шаг не валим: одна неудача не повод бросать цикл
      - run: |
          for i in $(seq 1 68); do
            curl -fsS --max-time 90 -o /dev/null https://coach-memory-bot.onrender.com/health \
              || echo "пинг $i не прошёл"
            sleep 300
          done
